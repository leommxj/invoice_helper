name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VCPKG_MAX_CONCURRENCY: 4
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '')
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '')

      - name: Set up vcpkg
        shell: pwsh
        run: |
          $baseline = (Get-Content vcpkg-configuration.json | ConvertFrom-Json).'default-registry'.baseline
          if (-not $baseline) { throw 'vcpkg baseline is missing' }

          git init tools/vcpkg
          git -C tools/vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C tools/vcpkg fetch --depth 1 origin $baseline
          git -C tools/vcpkg checkout --detach FETCH_HEAD
          .\tools\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          New-Item -ItemType Directory -Force -Path tools/vcpkg/downloads | Out-Null

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: tools/vcpkg/downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Configure
        shell: pwsh
        run: |
          $output = & cmake --preset windows-ninja-release 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath configure.log
          exit $exitCode

      - name: Configure diagnostics
        if: failure()
        shell: pwsh
        run: |
          $summary = $env:GITHUB_STEP_SUMMARY
          Add-Content -Path $summary -Value '## Configure diagnostics'

          if (Test-Path configure.log) {
            Add-Content -Path $summary -Value '### CMake output'
            Add-Content -Path $summary -Value '```text'
            Get-Content configure.log -Tail 200 | Add-Content -Path $summary
            Add-Content -Path $summary -Value '```'
          }

          $issue = 'build/windows-ninja/vcpkg_installed/vcpkg/issue_body.md'
          if (Test-Path $issue) {
            Add-Content -Path $summary -Value '### vcpkg issue body'
            Add-Content -Path $summary -Value '```text'
            Get-Content $issue -Tail 120 | Add-Content -Path $summary
            Add-Content -Path $summary -Value '```'
          }

          $logs = Get-ChildItem tools/vcpkg/buildtrees -Recurse -Filter '*.log' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 4
          foreach ($log in $logs) {
            Add-Content -Path $summary -Value "### $($log.FullName)"
            Add-Content -Path $summary -Value '```text'
            Get-Content $log.FullName -Tail 120 | Add-Content -Path $summary
            Add-Content -Path $summary -Value '```'
          }

      - name: Push diagnostics branch
        if: failure()
        shell: pwsh
        run: |
          $run = "${{ github.run_id }}"
          $dir = ".ci-diagnostics/$run"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          if (Test-Path configure.log) { Copy-Item configure.log "$dir/" }
          $issue = 'build/windows-ninja/vcpkg_installed/vcpkg/issue_body.md'
          if (Test-Path $issue) { Copy-Item $issue "$dir/" }

          Get-PSDrive C | Out-File "$dir/disk.txt"
          cmake --version | Out-File "$dir/versions.txt"
          .\tools\vcpkg\vcpkg.exe version | Out-File -Append "$dir/versions.txt"

          $logs = Get-ChildItem tools/vcpkg/buildtrees -Recurse -Filter '*.log' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 12
          foreach ($log in $logs) {
            Copy-Item $log.FullName "$dir/$($log.Directory.Name)-$($log.Name)"
          }

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "ci-diagnostics/$run"
          git add $dir
          git commit -m "ci: diagnostics for run $run"
          git push origin "HEAD:ci-diagnostics/$run"

      - name: Build
        run: cmake --build --preset windows-ninja-release --parallel 4

      - name: Package
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $name = "invoice-helper-$version-windows-x64"
          $dir = "release/$name"

          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "build/windows-ninja/bin/invoice_helper.exe" "$dir/"
          Copy-Item "LICENSE", "README.md", "docs/DEPENDENCIES.md" "$dir/"
          Compress-Archive -Path $dir -DestinationPath "release/$name.zip" -CompressionLevel Optimal

          $hash = (Get-FileHash "release/$name.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content "release/$name.zip.sha256" -Encoding ascii

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = $tag -replace '^v', ''
          $asset = "release/invoice-helper-$version-windows-x64.zip"
          $checksum = "$asset.sha256"

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksum --clobber
          } else {
            gh release create $tag $asset $checksum `
              --title "发票小助手 $tag" `
              --notes-file .github/release-notes.md
          }
